<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kania Galabau</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header { background: #667eea; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; }
        .logout-btn { background: #ff6b6b; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 500; }
        .logout-btn:hover { background: #ee5a52; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #667eea; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
        .controls button { padding: 10px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .controls button:hover { background: #764ba2; }
        .controls input { padding: 10px 16px; border: 1px solid #ddd; border-radius: 6px; }
        .candidates-table { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f9f9f9; padding: 15px; text-align: left; font-weight: 600; color: #333; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .delete-btn { background: #ff6b6b; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #ee5a52; }
        .loading { text-align: center; padding: 20px; color: #999; }
        .empty { text-align: center; padding: 40px; color: #999; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .login-box h2 { margin-bottom: 20px; color: #333; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; }
        .login-box button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .login-box button:hover { background: #764ba2; }
        .error { color: #ff6b6b; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="loginView" style="display: block;">
        <div class="login-container">
            <div class="login-box">
                <h2>Admin Login</h2>
                <div id="loginError" class="error"></div>
                <input type="password" id="adminPassword" placeholder="Admin Password" onkeypress="if(event.key==='Enter') login()">
                <button onclick="login()">Login</button>
            </div>
        </div>
    </div>

    <div id="adminView" style="display: none;">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="container">
            <div class="stats">
                <div class="stat-card">
                    <h3>Gesamt Bewerbungen</h3>
                    <div class="value" id="totalCandidates">0</div>
                </div>
                <div class="stat-card">
                    <h3>Diese Woche</h3>
                    <div class="value" id="weekCandidates">0</div>
                </div>
                <div class="stat-card">
                    <h3>Gelernte Fachkräfte</h3>
                    <div class="value" id="learnedCount">0</div>
                </div>
                <div class="stat-card">
                    <h3>Verfügbar sofort</h3>
                    <div class="value" id="availableSofort">0</div>
                </div>
            </div>

            <div class="controls">
                <input type="text" id="searchInput" placeholder="Nach Name oder Telefon suchen..." onkeyup="searchCandidates()">
                <button onclick="exportToCSV()">📥 Export CSV</button>
                <button onclick="refreshCandidates()">🔄 Refresh</button>
                <select id="filterSkill" onchange="filterCandidates()" style="padding: 10px 16px; border: 1px solid #ddd; border-radius: 6px;">
                    <option value="">Alle Level</option>
                    <option value="Ungelernt / Helfer">Ungelernt / Helfer</option>
                    <option value="Gelernt / Fachkraft">Gelernt / Fachkraft</option>
                    <option value="Meister / Vorarbeiter">Meister / Vorarbeiter</option>
                </select>
            </div>

            <div class="candidates-table">
                <table id="candidatesTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Telefon</th>
                            <th>Email</th>
                            <th>Level</th>
                            <th>Region</th>
                            <th>Verfügbarkeit</th>
                            <th>Deutsch</th>
                            <th>Registriert</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="candidatesList">
                        <tr><td colspan="9" class="loading">Lade Bewerbungen...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let candidates = [];
        let filteredCandidates = [];

        function login() {
            const password = document.getElementById('adminPassword').value;
            if (password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                loadCandidates();
            } else {
                document.getElementById('loginError').textContent = 'Falsches Passwort';
            }
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('adminView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        function checkLogin() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                loadCandidates();
            }
        }

        async function loadCandidates() {
            try {
                const response = await fetch('/api/candidates');
                candidates = await response.json();
                filteredCandidates = [...candidates];
                displayCandidates();
                updateStats();
            } catch (error) {
                console.error('Error loading candidates:', error);
                document.getElementById('candidatesList').innerHTML = '<tr><td colspan="9" class="error">Fehler beim Laden der Bewerbungen</td></tr>';
            }
        }

        function displayCandidates() {
            const tbody = document.getElementById('candidatesList');
            if (filteredCandidates.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty">Keine Bewerbungen gefunden</td></tr>';
                return;
            }

            tbody.innerHTML = filteredCandidates.map(c => `
                <tr>
                    <td><strong>${c.name}</strong></td>
                    <td><a href="tel:${c.phone}">${c.phone}</a></td>
                    <td>${c.email ? `<a href="mailto:${c.email}">${c.email}</a>` : '-'}</td>
                    <td>${c.skill_level || '-'}</td>
                    <td>${c.region || '-'}</td>
                    <td>${c.availability || '-'}</td>
                    <td>${c.language || '-'}</td>
                    <td>${new Date(c.created_at).toLocaleDateString('de-DE')}</td>
                    <td><button class="delete-btn" onclick="deleteCandidate(${c.id})">Löschen</button></td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

            const weekCount = candidates.filter(c => new Date(c.created_at) > weekAgo).length;
            const learnedCount = candidates.filter(c => c.skill_level === 'Gelernt / Fachkraft').length;
            const sofortCount = candidates.filter(c => c.availability === 'Sofort verfügbar').length;

            document.getElementById('totalCandidates').textContent = candidates.length;
            document.getElementById('weekCandidates').textContent = weekCount;
            document.getElementById('learnedCount').textContent = learnedCount;
            document.getElementById('availableSofort').textContent = sofortCount;
        }

        function searchCandidates() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            filteredCandidates = candidates.filter(c =>
                c.name.toLowerCase().includes(query) || c.phone.includes(query)
            );
            displayCandidates();
        }

        function filterCandidates() {
            const skill = document.getElementById('filterSkill').value;
            filteredCandidates = candidates.filter(c => !skill || c.skill_level === skill);
            displayCandidates();
        }

        async function deleteCandidate(id) {
            if (confirm('Wirklich löschen?')) {
                try {
                    await fetch(`/api/candidates/${id}`, { method: 'DELETE' });
                    loadCandidates();
                } catch (error) {
                    console.error('Error deleting candidate:', error);
                }
            }
        }

        function exportToCSV() {
            window.location.href = '/api/candidates/export/csv';
        }

        function refreshCandidates() {
            loadCandidates();
        }

        checkLogin();
    </script>
</body>
</html>
